[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ups-helper"
version = "0.1.0"
description = "Observe-only UPS outage controller and offline policy simulator"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
ups-helper = "ups_helper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
