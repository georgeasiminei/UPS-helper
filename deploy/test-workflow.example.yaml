name: Tests

on:
  pull_request:
  push:
    branches: [development]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: ups-helper config-check --config config/observe.example.yaml
      - run: ups-helper simulate --config config/simulation.example.yaml --scenario examples/outage-and-recovery.json
